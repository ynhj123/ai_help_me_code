server:
  port: 8080

spring:
  application:
    name: ecommerce-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: NEVER
      schema-locations: classpath:db/schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.ecommerce.entity


jwt:
  secret: ecommerceSecretKey
  expiration: 86400000

logging:
  level:
    com.example.ecommerce: DEBUG