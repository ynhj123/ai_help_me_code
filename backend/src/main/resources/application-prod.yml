spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    com.example.ecommerce: WARN
    org.springframework: WARN
    org.mybatis: WARN

# JWT配置
jwt:
  secret: ${JWT_SECRET:ecommerceSecretKey}
  expiration: ${JWT_EXPIRATION:86400000}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.ecommerce.entity
