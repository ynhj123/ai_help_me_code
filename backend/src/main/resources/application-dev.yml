spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

logging:
  level:
    com.example.ecommerce: DEBUG
    org.springframework: INFO
    org.mybatis: DEBUG

# JWT配置
jwt:
  secret: ecommerceSecretKey
  expiration: 86400000

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.ecommerce.entity
  configuration:
    map-underscore-to-camel-case: true